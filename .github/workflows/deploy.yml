# Deploys artraland.com to Vercel (project "artraland" in the "artraland" Vercel team) on every push to main.
# Needs a repository secret holding a Vercel access token scoped to that team: ARTRALAND.
# The first run creates the Vercel project if it does not exist yet, and attaches artraland.com to it.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.ARTRALAND }}
  VERCEL_SCOPE: artraland
  VERCEL_PROJECT: artraland

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add an ARTRALAND repository secret holding a Vercel token (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - run: npm install --global vercel@latest
      - name: Link the Vercel project (created on the first run)
        run: vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Deploy to production
        run: vercel deploy --prod --yes --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Attach the domains (already attached is fine)
        run: |
          for d in artraland.com www.artraland.com; do
            vercel domains add "$d" "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || echo "::warning::Could not attach $d — see the message above."
          done
