<html lang="en">
<head>

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05112f">
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <meta property="og:image" content="https://artraland.com/brand/og-artra.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Vazirmatn:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/photos/hero-silk.webp" media="(min-width: 721px)">
  <link rel="preload" as="image" href="/photos/hero-silk-phone.webp" media="(max-width: 720px)">
  <link rel="stylesheet" href="/royal.css?v=31">
  <link rel="stylesheet" href="/expertise.css?v=4">
  <script>
    // Picks the language before the page paints: the ?lang= address, then the visitor's last choice,
    // then their browser's language, else English. Arabic and Persian read right to left.
    (function () {
      var L = ["en", "fr", "es", "ar", "fa"], l = null, d = document.documentElement;
      try {
        var q = new URLSearchParams(location.search).get("lang");
        if (L.indexOf(q) > -1) { l = q; localStorage.setItem("artra-lang", q); }
        else { var s = localStorage.getItem("artra-lang"); if (L.indexOf(s) > -1) l = s; }
      } catch (e) {}
      if (!l) {
        var p = navigator.languages || [navigator.language || "en"];
        for (var i = 0; i < p.length && !l; i++) { var c = String(p[i]).slice(0, 2).toLowerCase(); if (L.indexOf(c) > -1) l = c; }
      }
      l = l || "en";
      d.lang = l;
      d.dir = l === "ar" || l === "fa" ? "rtl" : "ltr";
      d.className += " js";
    })();
  </script>
</head>

      <a href="/#commission" class="nav-cta" data-i18n="nav.commission">Commission</a>
    </nav>
    <div class="lang" id="lang" role="group"></div>
    <button class="burger" id="burger" data-i18n-aria="aria.menu" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
  </div>
</header>

<main id="main">

</section>
<section class="section rq">
  <div class="wrap">
    <ol class="rq-parts" aria-hidden="true">

      <li data-part="2"><span>2</span><b data-i18n="rq.p2"></b></li>
      <li data-part="3"><span>3</span><b data-i18n="rq.p3"></b></li>
      <li data-part="4"><span>4</span><b data-i18n="rq.p4"></b></li>
      <li data-part="5"><span>5</span><b data-i18n="rq.p5"></b></li>
    </ol>
    <div id="rqApp" aria-live="polite"><p class="muted" data-i18n="a.loading">Loading…</p></div>
  </div>
</section>
</main>

<footer class="foot">

    <span class="mark mark-sm"><img src="/brand/logo.webp" alt="ARTRA" width="720" height="158"></span>
    <span class="muted">© <span id="year">2026</span> · <span data-i18n="foot.tag">Royal handicrafts, made by hand.</span></span>
    <a href="/expertise#verify" class="muted" data-i18n="ex.verify_title">Check a certificate</a>

</footer>
